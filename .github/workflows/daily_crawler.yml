name: 🎈 Kids Activity Finder Daily Auto Crawler

on:
  schedule:
    # 매일 한국 시간 오전 6시 (UTC 21:00) 자동 실행
    - cron: '0 21 * * *'
  workflow_dispatch: # 수동 실행 지원

permissions:
  contents: write

jobs:
  crawl_and_update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 파이썬 3.10 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml python-dateutil

      - name: 🕷️ 성남시 및 수도권 키즈 활동/대회 크롤러 실행
        run: |
          python crawler_runner.py

      - name: 🔍 10개 출처 데이터 전수 교차 검증 (Health Check)
        run: |
          python verify_all.py

      - name: 🚀 갱신된 데이터 커밋 및 배포
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/activities.json web/activities.json activities.json
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "🤖 [자동 갱신] 최신 키즈 체험/대회 데이터 업데이트 ($(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST'))"
            git push origin main
          fi
