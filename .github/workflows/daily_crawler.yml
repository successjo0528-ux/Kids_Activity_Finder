name: 🎈 Kids Activity Finder Daily Auto Crawler & Health Check

on:
  schedule:
    # 매일 한국 시간 오전 9시 (UTC 00:00) 자동 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHub 웹 Actions 탭에서 수동 즉시 실행 지원

permissions:
  contents: write

jobs:
  crawl_and_update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 파이썬 3.10 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml python-dateutil

      - name: 🕷️ 10대 출처 실시간 크롤러 & 중복 제거 에이전트 실행
        run: |
          python crawler_runner.py

      - name: 🔍 8단계 출처·코드·URL 생존·중복 전수 검증 (Verify All)
        run: |
          python verify_all.py

      - name: 🚀 갱신된 데이터 및 웹 파일 커밋 & 라이브 배포
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ web/ activities.json
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "🤖 [자동 갱신] 최신 키즈 체험/전시/대회 데이터 업데이트 ($(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST'))"
            git push origin main
          fi
