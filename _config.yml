# GitHub Pages Jekyll Configuration
# 파이썬 스크립트 및 내부 마크다운 문서를 빌드 대상에서 제외하여 빌드 에러를 방지합니다.

include:
  - ".nojekyll"

exclude:
  - "*.py"
  - "core"
  - "scrapers"
  - "__pycache__"
  - "verify_all.py"
  - "crawler_runner.py"
  - "launcher.py"
  - "local_server.py"
  - "make_bat.py"
  - "make_push_bat.py"
  - "push_to_github.bat"
  - "run.bat"
  - "requirements.txt"
  - "SPECIFICATION.md"
  - "기능사양서.md"
  - "data"
